<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的小站</title>
  <p><a href="dianhao.html">👉 点这里打开电耗文件</a ></p >
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #1f2937;
      background: #f0f4f8;
    }

    .card {
      width: 100%;
      max-width: 640px;
      padding: 40px 32px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 6vw, 40px);
      line-height: 1.2;
    }

    .intro {
      margin: 0 0 32px;
      color: #64748b;
      font-size: 16px;
      line-height: 1.7;
    }

    h2 {
      margin: 0 0 16px;
      font-size: 18px;
    }

    .file-list {
      margin: 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid #e2e8f0;
    }

    .file-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .file-name {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-size: 15px;
    }

    .file-name::before {
      content: "📄";
      flex-shrink: 0;
    }

    .file-name span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .download {
      flex-shrink: 0;
      padding: 8px 16px;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s;
    }

    .download:hover { background: #1d4ed8; }

    @media (max-width: 480px) {
      body { padding: 16px; }
      .card { padding: 28px 20px; }
      .file-list li { gap: 12px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>我的小站</h1>
    <p class="intro">这是我用AI搭建的第一个网站</p>

    <section aria-labelledby="download-title">
      <h2 id="download-title">文件下载</h2>
      <ul class="file-list">
        <li>
          <div class="file-name"><span>个人简历.pdf</span></div>
          <a class="download" href="#">下载</a>
        </li>
        <li>
          <div class="file-name"><span>作品集.zip</span></div>
          <a class="download" href="#">下载</a>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
